<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>面積工坊 — 翰林五上數學第八單元 面積</title>
<meta name="description" content="剪一刀、拼一拼、公式自己來！在平板上動手切割重組，發現平行四邊形、三角形、梯形的面積公式。對應翰林版五年級上學期數學第八單元「面積」。">
<meta name="theme-color" content="#0f2a40">
<meta property="og:type" content="website">
<meta property="og:title" content="面積工坊">
<meta property="og:description" content="剪一刀、拼一拼、公式自己來！翰林五上數學第八單元「面積」互動練習。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22%3E%3Ctext%20y=%22.9em%22%20font-size=%2290%22%3E%E2%9C%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --kraft:#f3e7d0; --kraft2:#e9d8b8; --card:#fffaf0; --ink:#2b2118; --dim:#7a6a58; --line:#d8c6a6;
  --or:#f39a3d; --or-d:#c2631a; --teal:#2fb3a3; --teal-d:#17786c;
  --blue:#2f6fde; --red:#e4572e; --green:#2a9d6a; --violet:#7a4fd0; --yellow:#f6c343;
  --num:'Baloo 2','Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans TC',system-ui,sans-serif;color:var(--ink);background:var(--kraft);
  background-image:radial-gradient(rgba(120,90,50,.13) 1.2px,transparent 1.3px);background-size:22px 22px;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- 頂欄 ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;
  background:rgba(243,231,208,.92);backdrop-filter:blur(6px);border-bottom:3px solid var(--ink)}
.brand{font-weight:900;font-size:22px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.brand small{font-size:13px;font-weight:700;color:var(--dim);letter-spacing:0}
.top .sp{flex:1}
.chip{border:2.5px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:800;font-size:16px;box-shadow:3px 3px 0 var(--ink)}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.stars-total{font-family:var(--num);font-size:19px}

/* ---------- 首頁 ---------- */
#home{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:center;margin-bottom:22px}
.hero h1{font-size:clamp(34px,5vw,56px);margin:0 0 6px;line-height:1.1;font-weight:900}
.hero h1 em{font-style:normal;color:var(--or-d);background:linear-gradient(transparent 62%,#ffd98a 62%)}
.hero p{font-size:18px;color:var(--dim);margin:6px 0 0;line-height:1.6}
.hero-art{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:10px}
.hero-art svg{width:100%;display:block}
.map .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;margin-bottom:8px}
.map h2.sec{font-size:24px;font-weight:900;margin:26px 0 16px;padding-left:12px;border-left:8px solid var(--or)}
.map h2.sec:first-child{margin-top:4px}
.map h2.sec small{font-size:15px;color:var(--dim);font-weight:700;margin-left:6px}
.st{position:relative;text-align:left;border:3px solid var(--ink);background:var(--card);border-radius:20px;padding:16px 16px 14px;
  box-shadow:5px 5px 0 var(--ink);transition:transform .12s}
.st:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.st .no{position:absolute;top:-14px;left:14px;background:var(--ink);color:var(--kraft);font-family:var(--num);font-weight:800;
  font-size:15px;border-radius:999px;padding:1px 12px}
.st .ic{font-size:38px;line-height:1}
.st h3{margin:8px 0 2px;font-size:21px;font-weight:900}
.st p{margin:0;color:var(--dim);font-size:15px;font-weight:700}
.st .s3{margin-top:10px;font-size:22px;letter-spacing:2px;color:#cdbb98}
.st .s3 b{color:#f0a500}
.st.boss{background:#2b2118;color:var(--kraft)}
.st.boss p{color:#d9c8a6}.st.boss .no{background:var(--yellow);color:var(--ink)}
.tips{margin-top:26px;border:2.5px dashed var(--dim);border-radius:16px;padding:12px 16px;color:var(--dim);font-weight:700;line-height:1.7}

/* ---------- 工作台 ---------- */
#station{max-width:1280px;margin:0 auto;padding:16px 16px 40px}
.bar{height:14px;border:2.5px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--or) 0 10px,#f7b468 10px 20px);transition:width .4s}
.work{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
@media (max-width:900px){.work{grid-template-columns:1fr}.hero{grid-template-columns:1fr}}
.stage,.panel{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink)}
.stage{padding:10px;min-height:260px;display:flex;align-items:center;justify-content:center;touch-action:none}
.stage svg.fig{width:100%;height:auto;max-height:62vh;display:block;touch-action:none}
.panel{padding:18px 18px 20px}
.qtag{display:inline-block;background:var(--ink);color:var(--kraft);font-weight:900;border-radius:8px;padding:3px 12px;font-size:15px}
.prompt{font-size:22px;font-weight:800;line-height:1.55;margin:12px 0 14px}
.prompt .k{color:var(--blue)}.prompt .r{color:var(--red)}.prompt .o{color:var(--or-d)}
.ans{display:flex;align-items:baseline;justify-content:center;gap:10px;border:3px solid var(--ink);border-radius:16px;background:#fff;
  min-height:68px;padding:6px 16px;margin-bottom:10px}
.ans .v{font-family:var(--num);font-size:44px;font-weight:800;min-width:40px;text-align:right;color:var(--blue)}
.ans .v:empty::before{content:'？';color:#cbbfa8}
.ans .u{font-size:20px;font-weight:800;color:var(--dim)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pad button{height:62px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;font-family:var(--num);font-size:30px;font-weight:800;box-shadow:3px 3px 0 var(--ink)}
.pad button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.pad .ok{background:var(--green);color:#fff;font-size:24px}
.pad .del{background:var(--kraft2);font-size:24px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.one{grid-template-columns:1fr}
.opt{min-height:64px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;font-size:21px;font-weight:800;padding:10px;box-shadow:3px 3px 0 var(--ink)}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt.good{background:#d8f3e4;border-color:var(--green)}
.opt.bad{background:#fde0d6;border-color:var(--red);animation:shake .35s}
.opt[disabled]{cursor:default}
.fb{min-height:0;font-size:18px;font-weight:800;line-height:1.6;border-radius:14px;margin:0 0 12px;padding:0 14px}
.fb.show{padding:10px 14px}
.fb.good{background:#d8f3e4;color:#14603f}.fb.bad{background:#fde0d6;color:#9a2c0f}.fb.info{background:#e5edfc;color:#1d4aa0}
.big{width:100%;min-height:62px;border:3px solid var(--ink);border-radius:16px;font-size:22px;font-weight:900;background:var(--yellow);box-shadow:4px 4px 0 var(--ink);margin-top:6px}
.big:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.big.alt{background:#fff}
.big[disabled]{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.tool{min-height:56px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;font-size:19px;font-weight:900;box-shadow:3px 3px 0 var(--ink)}
.tool:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tool.on{background:var(--teal);color:#fff}
.formula{border:3px dashed var(--or-d);background:#fff3e2;border-radius:18px;padding:16px;text-align:center;margin:6px 0 14px}
.formula .t{font-size:17px;font-weight:800;color:var(--dim)}
.formula .f{font-size:clamp(24px,3vw,32px);font-weight:900;margin-top:6px}
.formula .f b{color:var(--blue)}.formula .f i{font-style:normal;color:var(--red)}
.note{font-size:17px;line-height:1.7;font-weight:700;color:var(--dim)}
.read{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:20px;font-weight:800;border:2.5px solid var(--ink);border-radius:16px;padding:12px 16px;background:#fff;margin-bottom:12px}
.read span{color:var(--dim)}.read b{font-family:var(--num);font-size:24px;color:var(--blue)}
table.tb{width:100%;border-collapse:collapse;font-size:19px;font-weight:800;margin-bottom:12px;background:#fff}
.tb td,.tb th{border:2px solid var(--ink);padding:8px;text-align:center}.tb th{background:var(--kraft2)}
.tb td.n{font-family:var(--num);font-size:22px;color:var(--blue)}
input[type=range]{width:100%;height:44px;-webkit-appearance:none;appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:999px;background:var(--kraft2);border:2px solid var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;background:var(--or);border:3px solid var(--ink);margin-top:-15px}
input[type=range]::-moz-range-track{height:12px;border-radius:999px;background:var(--kraft2);border:2px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--or);border:3px solid var(--ink)}
.timer{float:right;font-family:var(--num);font-size:22px;font-weight:800}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s both}

/* SVG */
.paper{fill:#fffdf7}
.gl{stroke:#e6dac4;stroke-width:1.2}
.shape{stroke-width:3;stroke-linejoin:round}
.s-or{fill:rgba(243,154,61,.55);stroke:var(--or-d)}
.s-teal{fill:rgba(47,179,163,.5);stroke:var(--teal-d)}
.s-ghost{fill:none;stroke:#8a7a66;stroke-width:2.5;stroke-dasharray:7 6}
.s-soft{fill:rgba(47,111,222,.18);stroke:var(--blue)}
.hgt{stroke:var(--red);stroke-width:3;stroke-dasharray:8 6}
.ext{stroke:#9b8b74;stroke-width:2.5;stroke-dasharray:4 6}
.base{stroke:var(--blue);stroke-width:7;stroke-linecap:round}
.par{stroke:var(--blue);stroke-width:2;stroke-dasharray:10 8;opacity:.6}
.ra{fill:none;stroke:var(--red);stroke-width:2.4}
.cut{stroke:#555;stroke-width:2.5;stroke-dasharray:3 5}
.lbl{font-family:'Noto Sans TC',sans-serif;font-size:19px;font-weight:900;fill:var(--ink);paint-order:stroke;stroke:#fffdf7;stroke-width:6px;stroke-linejoin:round}
.lbl.lh{fill:var(--red)}.lbl.lb{fill:var(--blue)}.lbl.ls{fill:#8a5a2a}.lbl.q{fill:var(--violet);font-size:26px}
.lbl.big{font-size:26px}
.drag{cursor:grab}.drag.grab{cursor:grabbing}
.drag.grab polygon{filter:drop-shadow(3px 5px 0 rgba(0,0,0,.25))}
.rotg{transform-box:fill-box;transform-origin:center;transition:transform .55s cubic-bezier(.5,1.6,.5,1)}
.rotg.r{transform:rotate(180deg)}
.slide{transition:transform .9s ease-in-out}
.fade{transition:opacity .6s}
.opt-line{stroke:var(--violet);stroke-width:4;stroke-dasharray:9 6}
.opt-line.good{stroke:var(--green);stroke-dasharray:none;stroke-width:5}
.opt-line.bad{stroke:#c9b9a2}
.hit{stroke:transparent;stroke-width:34;cursor:pointer}
.tagc{fill:var(--violet);stroke:#fff;stroke-width:3}
.tagt{fill:#fff;font-family:var(--num);font-size:22px;font-weight:800}
.scis{cursor:pointer}
.flipg{transform-box:fill-box;transform-origin:center;transition:transform .55s cubic-bezier(.5,1.6,.5,1)}
.flipg.r{transform:scaleY(-1)}
.s-p1{fill:rgba(47,179,163,.5);stroke:var(--teal-d)}
.s-p2{fill:rgba(243,154,61,.55);stroke:var(--or-d)}
.s-p3{fill:rgba(122,79,208,.28);stroke:var(--violet)}
.s-hole{fill:rgba(228,87,46,.12);stroke:var(--red);stroke-dasharray:6 5}
.lbl.pc{font-size:17px;fill:#173b36}
.foot{fill:var(--violet);stroke:#fff;stroke-width:3}
.pull{stroke:var(--violet);stroke-width:4;stroke-linecap:round}
.pull.ok{stroke:var(--green);stroke-width:5}
.baseline{stroke:var(--blue);stroke-width:2.5;stroke-dasharray:6 7;opacity:.7}
.angle{font-family:var(--num);font-size:24px;font-weight:800;fill:var(--violet);paint-order:stroke;stroke:#fffdf7;stroke-width:6px}
.board{fill:#e9c58f;stroke:#8a5a2a;stroke-width:4}
.peg{fill:#6b3f16}
.band{fill:rgba(228,87,46,.16);stroke:#d63b1f;stroke-width:6;stroke-linejoin:round}
.band.fixed{stroke:#2f6fde}
.vh{cursor:grab}
.vh .ring{fill:#fff;stroke:#d63b1f;stroke-width:4}
.vh .halo{fill:rgba(214,59,31,.15)}
.methods{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.methods .tool{flex:1;min-width:120px;font-size:17px}

.goalbar{background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:8px 14px;margin-bottom:12px;font-weight:700}
.goalbar summary{cursor:pointer;font-size:17px;font-weight:900}
.goalbar summary small{color:var(--dim);font-weight:700}
.goalbar ul{margin:8px 0 2px;padding-left:20px;line-height:1.7;color:var(--dim)}
.goalbar b,.goals b{color:var(--or-d)}
.goals{margin-top:28px}
.goals h2{font-size:24px;margin:0 0 12px}.goals h2 small{font-size:15px;color:var(--dim)}
.gcard{background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:12px 16px;margin-bottom:12px}
.gcard .gt{font-weight:900;font-size:18px}
.gcard ul{margin:6px 0 0;padding-left:20px;line-height:1.75;font-weight:700;color:#4a3d30}
.gs{display:inline-block;margin-left:8px;font-size:14px;color:var(--teal-d);background:#e3f5f1;border-radius:999px;padding:0 10px}
.livecard{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#e3f5f1;border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:16px 20px;margin-bottom:6px}
.livecard b{font-size:22px}.livecard p{margin:4px 0 0;color:#2c5b54;font-weight:700}
.livecard .lbtns{display:flex;gap:12px}.livecard .big{width:auto;padding:0 22px;margin:0}
.livebar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.livebar span{background:var(--card);border:2.5px solid var(--ink);border-radius:999px;padding:6px 16px;font-weight:800;font-size:18px}
.livebar b{font-family:var(--num);font-size:22px;color:var(--blue)}.livebar b.code{font-size:28px;letter-spacing:3px;color:var(--or-d)}
.waitbox{text-align:center;padding:30px 10px;font-size:24px}.waitbox .big-ic{font-size:90px}.waitbox p{color:var(--dim);font-size:20px}
.myans{font-family:var(--num);font-size:30px;color:var(--blue);font-weight:800}
.opt.pick{background:#fff3c4;border-color:var(--or-d);box-shadow:0 0 0 4px #ffd98a}
.lobby{text-align:center;padding:10px}.bigcode{font-family:var(--num);font-size:110px;font-weight:800;letter-spacing:14px;color:var(--or-d);line-height:1.1}
.qrbox{width:240px;margin:6px auto}.qrbox svg{width:100%;height:auto}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:14px}
.setgrid .st{padding-top:14px}
textarea.names,input.nickin{width:100%;font:inherit;font-size:18px;border:2.5px solid var(--ink);border-radius:12px;padding:10px;background:#fff;-webkit-user-select:text;user-select:text}
input.nickin{flex:2;min-height:62px}
.nicks{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.nicks .opt{font-size:17px;min-height:54px}
.linkbtn{background:none;border:none;color:var(--dim);text-decoration:underline;font-size:16px;font-weight:700;margin-top:10px;padding:6px}
.tg{margin-top:12px}.tg .tool{font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:18px}
.tiles.big{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.tile{position:relative;background:#f1ebe0;border:2.5px solid #bfae92;border-radius:14px;padding:8px 10px;min-height:56px}
.tile .th{display:flex;justify-content:space-between;align-items:center;font-size:17px;gap:4px}
.tile .th b{font-family:var(--num);font-size:22px}.tile .nk{font-size:14px;color:var(--teal-d);font-weight:800}.tile small{color:var(--dim)}
.tile.working{background:#fff8e1;border-color:var(--yellow)}
.tile.done{background:#e5edfc;border-color:var(--blue)}
.tile.ok{background:#d8f3e4;border-color:var(--green)}.tile.bad{background:#fde0d6;border-color:var(--red)}
.tile .ta{font-family:var(--num);font-size:22px;font-weight:800;color:var(--ink);margin-top:2px;word-break:break-all}
.tile .thumb svg{width:100%;height:auto;display:block}
.tile .kick{position:absolute;top:-10px;right:-10px;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:15px;line-height:1;opacity:.25;padding:0}
.tile:hover .kick,.tile .kick:focus{opacity:1}
.tiles-empty{margin-top:18px;color:var(--dim);font-weight:800;text-align:center}
.dist{margin-top:14px}.dr{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;margin:5px 0;font-weight:800}
.dr .dk{font-family:var(--num);font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dr .db{background:var(--kraft2);border-radius:8px;height:22px;overflow:hidden}
.dr .db i{display:block;height:100%;background:var(--blue)}.dr.ok .db i{background:var(--green)}.dr .dn{text-align:right}
.sumwrap{overflow-x:auto;margin-top:18px}table.sum td,table.sum th{padding:6px 8px;font-size:16px;white-space:nowrap}
table.sum td.c1{background:#d8f3e4;color:#14603f}table.sum td.c0{background:#fde0d6;color:#9a2c0f}
.whoami{font-size:30px;font-weight:900;margin-top:6px}.whoami b{font-family:var(--num);font-size:64px;color:var(--blue)}
.mytitle{display:inline-block;margin-top:8px;font-size:30px;font-weight:900;color:#7a4a00;background:linear-gradient(#ffe9a8,#f6c343);border:3px solid var(--ink);border-radius:14px;padding:6px 18px;box-shadow:4px 4px 0 var(--ink)}
#live{max-width:1400px;margin:0 auto;padding:14px 18px 40px}
.tiles-h{font-size:22px;font-weight:900;margin:22px 0 0;padding-left:12px;border-left:8px solid var(--teal)}
.tiles-h span{font-family:var(--num);color:var(--blue);font-size:26px}
.tiles.lobbyt{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.tiles.lobbyt .tile{background:#fff;border-color:var(--teal);min-height:70px;animation:pop .45s both}
.tiles.lobbyt .th b{font-size:30px}.tiles.lobbyt .nk{font-size:18px}
.tiles-empty{font-size:20px;padding:18px;border:3px dashed var(--line);border-radius:16px}
.gridh{font-size:22px;font-weight:900;margin-top:20px}.gridh small{font-size:15px;color:var(--dim);font-weight:700;margin-left:6px}
.thumb.zoom{cursor:zoom-in}.thumb img{width:100%;height:auto;display:block;border-radius:8px;background:#fff}
.nothumb{display:block;color:var(--dim);font-size:14px;padding:18px 0;text-align:center}
table.sum td.c2{background:#e5edfc;color:var(--blue)}

/* ===================== 航海風主題 ===================== */
:root{
  --kraft:#efe3c6; --kraft2:#e0cfa6; --card:#fffaf0; --ink:#13314a; --dim:#5d6c79; --line:#cdb88c;
  --or:#e8833a; --or-d:#b4561b; --teal:#1d8a9a; --teal-d:#0e5d69;
  --blue:#1f5fbf; --red:#cf4527; --green:#20865a; --yellow:#f2c14e;
  --navy:#0f2a40; --navy2:#173f5f; --sea:#2a7fa8; --brass:#d9a441; --rope:#b88a4a;
  --serif:'Noto Serif TC','Noto Sans TC',serif;
}
body{background-color:var(--kraft);
  background-image:
    radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.55),transparent 60%),
    linear-gradient(rgba(19,49,74,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(19,49,74,.05) 1px,transparent 1px);
  background-size:auto,48px 48px,48px 48px}
/* 頂欄：深海藍＋繩索 */

/* 標題 */
.hero h1{font-family:var(--serif);color:var(--navy)}
.hero h1 em{color:var(--or-d);background:linear-gradient(transparent 62%,#f7d88a 62%)}
.hero .kicker{display:inline-block;font-weight:900;color:#f6e7c1;background:var(--navy2);border-radius:999px;padding:4px 16px;font-size:15px;letter-spacing:2px;margin-bottom:10px}
.hero-art{border:3px solid var(--navy);box-shadow:6px 6px 0 var(--navy);outline:3px dashed var(--rope);outline-offset:6px;border-radius:24px}
/* 卡片與面板 */

.stage,.panel{box-shadow:6px 6px 0 var(--navy)}

.pad button,.opt,.tool,.chip{border-color:var(--navy)}

/* 勇者卡（比照勇者 RPG 打卡畫面，不顯示姓名） */

.hcard .kick{position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:15px;line-height:1;opacity:.25;padding:0}
.hcard:hover .kick{opacity:1}
button.hcard{cursor:pointer;box-shadow:3px 3px 0 var(--navy)}button.hcard:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--navy)}
button.hcard.taken{opacity:.55}
.pickgrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}

/* 重點講解卡 */

/* 結果 */
.result{text-align:center;padding:10px 0}

.cert{border:3px solid var(--ink);border-radius:18px;background:#fff;padding:14px;margin:12px 0;font-size:20px;font-weight:800;line-height:1.8}

.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:99;pointer-events:none;animation:fall linear forwards}

  padding:12px 22px;border-radius:999px;z-index:90;animation:pop .3s both}

<body>

<div class="top">
  <button class="chip hidden" id="backBtn">← 地圖</button>
  <div class="brand">⚓ 面積工坊 <small id="subTitle">五上・第八單元</small></div>
  <div class="sp"></div>
  <button class="chip" id="muteBtn" aria-label="音效">🔊</button>
  <div class="chip stars-total">⭐ <span id="starTotal">0</span></div>
</div>

<!-- ============ 首頁 ============ -->
<main id="home">
  <section class="hero">
    <div>
      <div class="kicker">⛵ 五年級・面積航海日誌</div>
      <h1>剪一刀、拼一拼，<br><em>公式自己來！</em></h1>
      <p>長方形的面積我們早就會算了。今天的任務：用剪刀和複製機，把平行四邊形、三角形、梯形都「變」成會算的形狀，自己找出面積公式！</p>
    </div>
    <div class="hero-art" id="heroArt"></div>
  </section>
  <section class="livecard">
    <div><b>🟢 課堂即時作答</b><p>全班同一題，大家都答完才換下一題。老師即時看到每個人的答案和釘板、畫高的操作。</p></div>
    <div class="lbtns"><button class="big" onclick="location.hash='#live'">🙋 學生加入</button><button class="big alt" onclick="location.hash='#teacher'">👩‍🏫 老師開房間</button></div>
  </section>

  <section class="goals" id="goalsHome"></section>
  <div class="tips">📱 操作小提醒：圖形可以用手指<b>拖曳</b>；答案用畫面上的<b>數字鍵</b>輸入。每個工作台第一次就答對越多，星星越多（最多 3 顆）。進度存在這台平板上。</div>
</main>

<!-- ============ 課堂即時作答 ============ -->
<main id="live" class="hidden">
  <div id="ltop"></div>
  <div class="work">
    <div class="stage" id="lstage"></div>
    <div class="panel" id="lpanel"></div>
  </div>
  <div id="lbelow"></div>
</main>

<!-- ============ 工作台 ============ -->
<main id="station" class="hidden">
  <details class="goalbar" id="goalBar"></details>
  <div class="bar"><i id="barFill"></i></div>
  <div class="work">
    <div class="stage" id="stage"></div>
    <div class="panel" id="panel"></div>
  </div>
</main>

<script>
/* =========================================================
   面積工坊　翰林五上第八單元「面積」
   8-1 平行四邊形 → 8-2 三角形 → 8-3 梯形 → 8-4 等底等高、複合圖形
   課綱邊界：邊長與高一律整數；不做圓面積、表面積、體積
   ========================================================= */
const U = 40;
const $ = s => document.querySelector(s);
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const unit = v => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; };

/* ---------- 音效 ---------- */
let muted = localStorage.getItem('area-lab-mute') === '1', actx = null;
function beep(freqs, dur = .12, type = 'triangle') {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * dur;
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + dur * 1.6);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur * 1.7);
    });
  } catch (e) {}
}
const sGood = () => beep([660, 880, 1175]);
const sBad = () => beep([220, 180], .15, 'sawtooth');
const sSnap = () => beep([523, 784], .09);
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
function confetti(n = 70) {
  const cs = ['#f39a3d', '#2fb3a3', '#2f6fde', '#e4572e', '#f6c343', '#7a4fd0'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = pick(cs);
    c.style.animationDuration = (1.8 + Math.random() * 1.8) + 's'; c.style.animationDelay = Math.random() * .5 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 4200);
  }
}

/* ---------- SVG 工具（座標用「格」為單位，1 格 = 1 公分） ---------- */
const P = x => (x * U).toFixed(1);
const pts = a => a.map(p => P(p[0]) + ',' + P(p[1])).join(' ');
function fig(cols, rows, inner, pad = 1, grid = true) {
  let g = '';
  if (grid) for (let i = 0; i <= cols; i++) g += `<line x1="${P(i)}" y1="0" x2="${P(i)}" y2="${P(rows)}" class="gl"/>`;
  if (grid) for (let j = 0; j <= rows; j++) g += `<line x1="0" y1="${P(j)}" x2="${P(cols)}" y2="${P(j)}" class="gl"/>`;
  return `<svg class="fig" viewBox="${-pad * U} ${-pad * U} ${(cols + 2 * pad) * U} ${(rows + 2 * pad) * U}" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="${P(cols)}" height="${P(rows)}" class="paper"/>${g}${inner}</svg>`;
}
const poly = (a, cls, extra = '') => `<polygon points="${pts(a)}" class="${cls}" ${extra}/>`;
const seg = (a, b, cls, extra = '') => `<line x1="${P(a[0])}" y1="${P(a[1])}" x2="${P(b[0])}" y2="${P(b[1])}" class="${cls}" ${extra}/>`;
const txt = (x, y, s, cls = 'lbl', anchor = 'middle') => `<text x="${P(x)}" y="${P(y)}" class="${cls}" text-anchor="${anchor}" dominant-baseline="middle">${s}</text>`;
function rmark(F, top, A, B, k = .38) {
  const v = unit([top[0] - F[0], top[1] - F[1]]);
  let u = unit([B[0] - A[0], B[1] - A[1]]);
  const mid = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2];
  if ((mid[0] - F[0]) * u[0] + (mid[1] - F[1]) * u[1] < 0) u = [-u[0], -u[1]];
  const a = [F[0] + u[0] * k, F[1] + u[1] * k], b = [a[0] + v[0] * k, a[1] + v[1] * k], c = [F[0] + v[0] * k, F[1] + v[1] * k];
  return `<polyline points="${pts([a, b, c])}" class="ra"/>`;
}
function ext(F, A, B) { // 底邊延長線
  if (F[0] > Math.max(A[0], B[0]) + .01) return seg([Math.max(A[0], B[0]), A[1]], F, 'ext');
  if (F[0] < Math.min(A[0], B[0]) - .01) return seg(F, [Math.min(A[0], B[0]), A[1]], 'ext');
  return '';
}
function heightMark(T, F, A, B, label) {
  return ext(F, A, B) + seg(T, F, 'hgt') + rmark(F, T, A, B) + (label ? txt(T[0] + .2, (T[1] + F[1]) / 2, label, label === '?' ? 'lbl q' : 'lbl lh', 'start') : '');
}
function svgPt(svg, e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function dragify(svg, el, onStart, onMove, onEnd) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    const s = svgPt(svg, e); el.classList.add('grab'); onStart && onStart();
    const mv = ev => { const p = svgPt(svg, ev); onMove([(p.x - s.x) / U, (p.y - s.y) / U]); };
    const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); el.classList.remove('grab'); onEnd && onEnd(); };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
}

/* ---------- 圖形產生器 ---------- */
function pgFigure(b, h, s, o = {}) {           // 底 b、高 h、上邊往右偏 s
  const minx = Math.min(0, s), maxx = Math.max(b, b + s);
  const ox = 1 - minx, oy = 1, cols = maxx - minx + 2, rows = h + 2;
  const A = [ox, oy + h], B = [ox + b, oy + h], C = [ox + b + s, oy], D = [ox + s, oy], F = [ox + s, oy + h];
  let g = poly([A, B, C, D], 'shape s-or');
  g += heightMark(D, F, A, B, o.hQ ? '?' : (o.lh || h + ' 公分'));

const HINT_PG = '平行四邊形面積 ＝ <b>底 × 高</b>。高是和底「垂直」的那條紅色虛線喔！';

function genPG(kind) {
  let b, h, s, slant = null;
  if (kind === 'slant') { [s, h] = pick([[3, 4], [4, 3]]); b = R(5, 8); slant = 5; }

  return { concept: 'pg', tag: '平行四邊形', q: '這個平行四邊形的面積是多少平方公分？', fig: pgFigure(b, h, s, { slant }), a: b * h, unit: '平方公分',
    hint: slant ? '小心！斜邊 ' + slant + ' 公分不是高。' + HINT_PG : HINT_PG, exp: `底 × 高 ＝ ${b} × ${h} ＝ ${b * h}（平方公分）` };
}
function genTri(kind) {
  let b, h, a;
  do {
    if (kind === 'out') { b = R(3, 5); h = R(2, 5); a = b + R(1, 2); }
    else if (kind === 'right') { b = R(3, 8); h = R(2, 6); a = 0; }

    hint: (kind === 'out' ? '這個三角形的高在外面，要把底延長才畫得出來。' : '') + HINT_TRI, exp: `底 × 高 ÷ 2 ＝ ${b} × ${h} ÷ 2 ＝ ${b * h / 2}（平方公分）` };
}
function genTrap() {

  const s = R(1, l - u - 1);
  return { concept: 'trap', tag: '梯形', q: '這個梯形的面積是多少平方公分？', fig: trapFigure(u, l, h, s), a: (u + l) * h / 2, unit: '平方公分',
    hint: HINT_TRAP, exp: `(上底＋下底) × 高 ÷ 2 ＝ (${u}＋${l}) × ${h} ÷ 2 ＝ ${(u + l) * h / 2}（平方公分）` };

}

function heightRound(r) {
  const order = shuffle(r.opts.map((o, i) => ({ ...o, ok: i === 0 })));   // 建題時就決定順序，老師與學生的 A、B、C 一致
  return ctx => {
    const letters = ['A', 'B', 'C'];
    const opts = order;
    let tries = 0, over = false;
    const draw = (reveal) => {
      let g = poly(r.shape, 'shape s-or') + seg(r.base[0], r.base[1], 'base');
      if (r.extTo) g += seg(r.extFrom, r.extTo, 'ext');
      opts.forEach((o, i) => {
        const cls = reveal ? (o.ok ? 'opt-line good' : 'opt-line bad') : 'opt-line';
        const m = [o.a[0] + (o.b[0] - o.a[0]) * (o.t || .5), o.a[1] + (o.b[1] - o.a[1]) * (o.t || .5)];
        g += `<g class="pick" data-i="${i}">${seg(o.a, o.b, cls)}${seg(o.a, o.b, 'hit')}<circle cx="${P(m[0])}" cy="${P(m[1])}" r="17" class="tagc" ${reveal && !o.ok ? 'opacity=".35"' : ''}/><text x="${P(m[0])}" y="${P(m[1]) * 1 + 1}" class="tagt" text-anchor="middle" dominant-baseline="middle">${letters[i]}</text></g>`;
        if (reveal && o.ok) g += rmark(o.b, o.a, r.base[0], r.base[1]);
      });
      ctx.stage.innerHTML = fig(r.cols, r.rows, g);
      ctx.stage.querySelectorAll('.pick').forEach(el => el.onclick = () => choose(+el.dataset.i));
    };
    ctx.panel.innerHTML = `<span class="qtag">找高 ${r.no}</span><div class="prompt">${r.q}</div>`;
    const box = mk('div', 'opts'); box.style.gridTemplateColumns = 'repeat(3,1fr)'; ctx.panel.appendChild(box);
    letters.forEach((L, i) => { const b = mk('button', 'opt', L); b.onclick = () => choose(i); box.appendChild(b); });
    const fb = mk('div', 'fb'); fb.style.marginTop = '12px'; ctx.panel.appendChild(fb);
    function choose(i) {
      if (over) return;
      const btn = box.children[i];
      if (opts[i].ok) {
        over = true; sGood(); btn.classList.add('good'); draw(true);
        fb.className = 'fb good show'; fb.innerHTML = '✅ 答對了！' + r.exp; ctx.record(tries === 0); nextBtn(ctx);
      } else {
        sBad(); tries++; btn.classList.add('bad'); btn.disabled = true;
        if (tries === 1) { fb.className = 'fb bad show'; fb.innerHTML = '再想想看～ 高一定要和<b style="color:var(--blue)">藍色的底</b>「垂直」（形成直角）。可以拿三角板的直角對對看！'; }
        else { over = true; draw(true); opts.forEach((o, k) => { if (o.ok) box.children[k].classList.add('good'); }); fb.className = 'fb info show'; fb.innerHTML = '綠色那條才是高。' + r.exp; ctx.record(false); nextBtn(ctx); }
      }
    };
    draw(false);
  };
}

/* ---------- 量高：拖動三角板，量平行線間的距離（課本 p.121、128） ---------- */
function measureLab(o) {
  return ctx => {
    const [x0, x1] = o.range, yt = o.yt, yb = o.yb; let x = o.start, xs, last = x; const seen = new Set();
    const ruler = xx => `<polygon points="${pts([[xx, yb], [xx + 1.6, yb], [xx, yt]])}" fill="rgba(47,111,222,.13)" stroke="#2f6fde" stroke-width="2"/>` +
      seg([xx, yt], [xx, yb], 'hgt') + rmark([xx, yb], [xx, yt], [x0, yb], [x1, yb]) + txt(xx - .2, (yt + yb) / 2, o.len, 'lbl lh', 'end');
    ctx.stage.innerHTML = fig(o.cols, o.rows, poly(o.shape, 'shape s-or') + o.sides.map(s => seg(s[0], s[1], 'base')).join('') + (o.extra || '') +
      `<g id="rl" class="drag">${ruler(x)}<circle cx="${P(x + .8)}" cy="${P(yb - .5)}" r="15" fill="var(--blue)" stroke="#fff" stroke-width="3"/></g>`);
    const svg = ctx.stage.querySelector('svg'), rl = svg.querySelector('#rl'), xDraw = x;
    const note = mk('div', 'note');
    dragify(svg, rl, () => xs = x, d => { x = Math.round(clamp(xs + d[0], x0, x1) * 2) / 2; rl.setAttribute('transform', `translate(${P(x - xDraw)},0)`); if (x !== last) { last = x; beep([500], .02); } }, () => {
      seen.add(x); note.innerHTML = `已經量了 <b>${seen.size}</b> 個位置，每次都是 <b>${o.len}</b>。`;
      if (seen.size >= 3 && !done) { done = true; sGood(); fb.className = 'fb good show pop'; fb.innerHTML = o.success; ctx.record(true); nextBtn(ctx, '繼續 →'); }
    });
    let done = false;
    ctx.panel.innerHTML = `<span class="qtag">量量看</span><div class="prompt">${o.q}</div><div class="note" style="margin-bottom:8px">拖動藍色<b>三角板</b>，讓直角對齊<span class="k">藍色的邊</span>，在<b>3 個不同位置</b>量量看。</div>`;
    ctx.panel.appendChild(note); const fb = mk('div', 'fb'); fb.style.marginTop = '10px'; ctx.panel.appendChild(fb);
  };
}

/* ---------- 指一指：依序點出底、高、上底、下底（課本 p.122、129） ---------- */
function tapLabel(o) {
  return ctx => {
    let k = 0, miss = 0; const named = {};
    const draw = () => {
      let g = poly(o.shape, 'shape s-or') + (o.extra || '');
      o.segs.forEach(s => {
        const on = named[s.id];
        g += `<g class="pick" data-id="${s.id}">${seg(s.a, s.b, on ? 'opt-line good' : 'opt-line')}${seg(s.a, s.b, 'hit')}</g>` + txt(s.lx, s.ly, s.label + (on ? `（${on}）` : ''), on ? 'lbl lb' : 'lbl', s.anchor || 'middle');
      });
      ctx.stage.innerHTML = fig(o.cols, o.rows, g, 1, !o.nogrid);
      ctx.stage.querySelectorAll('.pick').forEach(el => el.onclick = () => tap(el.dataset.id));
    };
    const ask = () => { qEl.innerHTML = `${o.q || ''}點一點：哪一條是<span class="r">「${o.asks[k].name}」</span>？`; };
    function tap(id) {
      if (k >= o.asks.length || named[id]) return;
      const a = o.asks[k];
      if (id === a.id) {
        named[id] = a.name; sSnap(); k++; draw(); fb.className = 'fb good show'; fb.innerHTML = `✅ 對！${a.why || ''}`;
        if (k >= o.asks.length) { ctx.record(miss === 0); qEl.innerHTML = o.done || '都找到了！'; nextBtn(ctx, '繼續 →'); } else ask();
      } else { miss++; sBad(); fb.className = 'fb bad show'; fb.innerHTML = '不是這一條喔！' + (o.asks[k].hint || ''); }
    }
    ctx.panel.innerHTML = `<span class="qtag">指一指</span><div class="prompt"></div>`;
    const qEl = ctx.panel.querySelector('.prompt'); const fb = mk('div', 'fb'); ctx.panel.appendChild(fb);
    ask(); draw();
  };
}

/* ---------- 等底等高：在平行線上滑動（三角形頂點／平行四邊形上邊） ---------- */
function slideLab(kind) {
  return ctx => {
    let ax = kind === 'tri' ? 7 : 4, ax0, moved = 0, last = ax; const ghosts = [];
    const A = [4, 5], B = [10, 5];
    const shapeAt = x => kind === 'tri' ? [A, B, [x, 1]] : [A, B, [x + 6, 1], [x, 1]];
    const area = kind === 'tri' ? '6 × 4 ÷ 2 ＝ 12' : '6 × 4 ＝ 24';
    const draw = () => {
      let g = seg([-1, 1], [17, 1], 'par') + seg([-1, 5], [17, 5], 'par');
      ghosts.forEach(x => g += poly(shapeAt(x), 'shape s-ghost'));
      g += poly(shapeAt(ax), 'shape s-or', 'id="sh"') + seg(A, B, 'base') + `<g id="hm">${heightMark([ax, 1], [ax, 5], A, B, '4 公分')}</g>` + txt(7, 5.6, '6 公分', 'lbl lb');
      const hx = kind === 'tri' ? ax : ax + 3;
      g += `<g id="hd" class="drag"><circle cx="${P(hx)}" cy="${P(1)}" r="26" fill="rgba(122,79,208,.18)"/><circle cx="${P(hx)}" cy="${P(1)}" r="13" fill="var(--violet)" stroke="#fff" stroke-width="3"/></g>`;
      ctx.stage.innerHTML = fig(16, 6, g);
      const svg = ctx.stage.querySelector('svg');
      dragify(svg, svg.querySelector('#hd'), () => ax0 = ax, d => {
        ax = Math.round(clamp(ax0 + d[0], kind === 'tri' ? 0 : -1, kind === 'tri' ? 16 : 11) * 2) / 2;
        if (ax !== last) {
          moved += Math.abs(ax - last); last = ax;
          svg.querySelector('#sh').setAttribute('points', pts(shapeAt(ax)));
          svg.querySelector('#hm').innerHTML = heightMark([ax, 1], [ax, 5], A, B, '4 公分');
          svg.querySelectorAll('#hd circle').forEach(c => c.setAttribute('cx', P(kind === 'tri' ? ax : ax + 3)));
        }
      }, () => { ghosts.push(ax); if (ghosts.length > 5) ghosts.shift(); draw(); if (moved >= 6 && !btn.isConnected) { ctx.panel.appendChild(fb); ctx.panel.appendChild(btn); } });
    };
    ctx.panel.innerHTML = `<span class="qtag">實驗室</span><div class="prompt">拖動<span style="color:var(--violet)">紫色圓點</span>，讓${kind === 'tri' ? '三角形的頂點' : '平行四邊形的上邊'}在上面那條平行線上<b>左右滑動</b>。<br>形狀變了，面積呢？</div>
      <div class="read"><span>底</span><b>6 公分</b><span>高</span><b>4 公分</b><span>面積</span><b>${area} 平方公分</b></div>`;
    const fb = mk('div', 'fb info show', `🔍 怎麼滑，底都是 6、高都是 4（兩條平行線的距離不變），所以面積<b>永遠是 ${area.split('＝ ')[1]} 平方公分</b>！`);
    const btn = mk('button', 'big pop', '我發現了 →'); btn.onclick = () => ctx.next();
    draw();
  };
}

/* ---------- 底或高變成幾倍（課本 p.131） ---------- */
function multLab(which) {
  return ctx => {
    const res = {};
    const vals = which === '高' ? [2, 4, 6] : [2, 4, 6];
    const draw = v => {

    const tb = mk('table', 'tb', `<tr><th>${which}</th><th>面積</th><th>是原來的</th></tr>`); tb.style.marginTop = '12px'; ctx.panel.appendChild(tb);
    vals.forEach((v, i) => {
      const b = mk('button', 'tool', `${which} ${v} 公分`);
      b.onclick = () => {
        draw(v); row.querySelectorAll('.tool').forEach(x => x.classList.remove('on')); b.classList.add('on'); beep([330 + v * 60], .08);
        const area = which === '高' ? 4 * v / 2 : v * 3 / 2, f = which === '高' ? `4 × ${v} ÷ 2` : `${v} × 3 ÷ 2`;
        if (!res[v]) { res[v] = 1; tb.insertAdjacentHTML('beforeend', `<tr class="pop"><td class="n">${v}</td><td class="n">${f} ＝ ${area}</td><td>${i ? (i + 1) + ' 倍' : '—'}</td></tr>`); }
        if (Object.keys(res).length === 3 && !ctx.panel.querySelector('.big')) nextBtn(ctx, '我發現了 →');
      };
      row.appendChild(b);
    });
    draw(vals[0]);
  };
}

/* ---------- 道路問題圖（梯形土地＋平行四邊形道路，按比例縮小） ---------- */
function roadFigure(u, l, h, w, unit, moved) {
  const k = 12 / l, H = h * k, s = (l - u) / 2 * k, U2 = u * k, L = l * k, W = w * k;
  const xb = L * .42, xt = s + U2 * .5;
  const o = (p) => [p[0] + 1, p[1] + 1];
  const left = [[0, H], [xb, H], [xt, 0], [s, 0]].map(o), road = [[xb, H], [xb + W, H], [xt + W, 0], [xt, 0]].map(o), right = [[xb + W, H], [L, H], [s + U2, 0], [xt + W, 0]].map(o);
  let g = poly(left, 'shape s-or') + `<g class="slide" id="rt" ${moved ? `style="transform:translateX(${-W * U}px)"` : ''}>${poly(right, 'shape s-or')}</g>` +
    `<g class="fade" id="rd" ${moved ? 'style="opacity:0"' : ''}>${poly(road, 'shape', 'fill="#9a8f80" stroke="#5f564b"')}${txt(xb + W / 2 + 1, H + 1.6, '路寬 ' + w, 'lbl')}</g>`;
  g += txt(L / 2 + 1, H + 2.3, moved ? `下底 ${l} − ${w} ＝ ${l - w} ${unit}` : `下底 ${l} ${unit}`, 'lbl lb" id="lb1') + txt(L / 2 + 1, .45, moved ? `上底 ${u} − ${w} ＝ ${u - w} ${unit}` : `上底 ${u} ${unit}`, 'lbl lb" id="lb2') +
    heightMark([s + 1, 1], [s + 1, H + 1], [1, H + 1], [L + 1, H + 1], h + ' ' + unit);
  return fig(L + 2, H + 2.6, g, 1, false);
}
function roadMove(u, l, h, w, unit) {
  return ctx => {
    ctx.stage.innerHTML = roadFigure(u, l, h, w, unit, false);
    ctx.panel.innerHTML = `<span class="qtag">動手做</span><div class="prompt">皮皮的方法：把道路拿掉，把右邊的土地<b>往左推</b>，會拼成什麼形狀？</div>`;
    const b = mk('button', 'big', '➡️ 拿掉道路，往左推！'); ctx.panel.appendChild(b);
    b.onclick = () => {
      b.remove(); const s = ctx.stage, W = w * 12 / l;
      s.querySelector('#rd').style.opacity = 0; s.querySelector('#rt').style.transform = `translateX(${-W * U}px)`; sSnap();
      setTimeout(() => {
        s.querySelector('#lb1').textContent = `下底 ${l} − ${w} ＝ ${l - w} ${unit}`; s.querySelector('#lb2').textContent = `上底 ${u} − ${w} ＝ ${u - w} ${unit}`;
        ctx.panel.insertAdjacentHTML('beforeend', `<div class="fb good show pop">拼成一個新的<b>梯形</b>！<br>上底和下底都<b>少了路寬 ${w} ${unit}</b>，高還是 ${h} ${unit}。</div>`);
        nextBtn(ctx, '繼續 →');
      }, 950);
    };
  };
}

/* ---------- 共用圖：釘板、畫高 ---------- */
function boardSVG(ps, o = {}) {
  const N = 6;
  let g = `<rect x="${-.5 * U}" y="${-.5 * U}" width="${(N + 1) * U}" height="${(N + 1) * U}" rx="18" class="board"/>`;
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) g += `<circle cx="${P(i)}" cy="${P(j)}" r="6" class="peg"/>`;
  g += `<polygon id="band" class="band" points="${ps ? pts(ps) : ''}"/>`;
  if (o.handles) ps.forEach((p, i) => g += (o.fixed || []).includes(i) ? `<g id="v${i}" transform="translate(${P(p[0])},${P(p[1])})"><circle r="11" fill="#2f6fde" stroke="#fff" stroke-width="3"/></g>` : `<g id="v${i}" class="vh drag" transform="translate(${P(p[0])},${P(p[1])})"><circle r="28" class="halo"/><circle r="12" class="ring"/></g>`);
  return `<svg class="fig" viewBox="${-.9 * U} ${-.9 * U} ${(N + 1.8) * U} ${(N + 1.8) * U}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}
function pullInfo(q, t) {
  const [A, B] = q.base, d = [B[0] - A[0], B[1] - A[1]], L2 = d[0] * d[0] + d[1] * d[1];
  const tStar = ((q.apex[0] - A[0]) * d[0] + (q.apex[1] - A[1]) * d[1]) / L2;
  const F = [A[0] + d[0] * t, A[1] + d[1] * t], v = [q.apex[0] - F[0], q.apex[1] - F[1]];
  const c = Math.abs(v[0] * d[0] + v[1] * d[1]) / (Math.hypot(...v) * Math.sqrt(L2) || 1);
  return { A, B, d, L2, tStar, F, ang: Math.round(Math.acos(Math.min(1, c)) * 180 / Math.PI), ok: Math.abs(t - tStar) * Math.sqrt(L2) < .3 };
}
function pullSVG(q, t, o = {}) {
  const lo = pullInfo(q, q.range[0]).F, hi = pullInfo(q, q.range[1]).F;
  let g = poly(q.shape, 'shape s-or') + seg(lo, hi, 'baseline') + seg(q.base[0], q.base[1], 'base') + `<circle cx="${P(q.apex[0])}" cy="${P(q.apex[1])}" r="8" fill="var(--violet)"/>`;
  if (t != null) { const I = pullInfo(q, t); g += seg(q.apex, I.F, 'pull' + (o.mark && I.ok ? ' ok' : '')) + `<circle cx="${P(I.F[0])}" cy="${P(I.F[1])}" r="10" class="foot"/>`; if (o.mark && I.ok) g += rmark(I.F, q.apex, q.base[0], q.base[1]); }
  return fig(q.cols, q.rows, g);
}
function questionFig(q) {
  if (q.type === 'geo') return boardSVG(q.init);
  if (q.type === 'pull') return pullSVG(q, null);
  return q.fig || '';
}
function thumbOf(q, payload, mark) {
  if (!payload) return '';
  if (q.type === 'step') return svgImg(payload.svg);
  if (q.type === 'geo') return boardSVG(payload.ps);
  if (q.type === 'pull') return pullSVG(q, payload.t, { mark });
  return '';
}

/* ---------- 學生作答畫面 ---------- */
function renderLiveQ(q, stage, panel, onSubmit, onDraft) {
  panel.innerHTML = `<span class="qtag">${q.tag || '作答'}</span><div class="prompt">${q.q}</div>`;
  const send = mk('button', 'big', '📤 送出答案');
  const lock = () => { send.disabled = true; panel.querySelectorAll('button').forEach(b => b.disabled = true); };
  if (q.type === 'num') {
    stage.innerHTML = q.fig || '';
    const ans = mk('div', 'ans', `<span class="v"></span><span class="u">${q.unit || ''}</span>`); panel.appendChild(ans);
    const v = ans.querySelector('.v'); let val = '';
    const pad = mk('div', 'pad');
    ['7', '8', '9', '4', '5', '6', '1', '2', '3', '⌫', '0', '✓'].forEach(k => {
      const b = mk('button', k === '✓' ? 'ok' : k === '⌫' ? 'del' : '', k === '✓' ? '送出' : k);
      b.onclick = () => {
        if (k === '⌫') val = val.slice(0, -1);
        else if (k === '✓') { if (!val) return; lock(); return onSubmit(val, null, +val === q.a); }
        else if (val.length < 5) val = (val === '0' ? '' : val) + k;
        v.textContent = val;
      };
      pad.appendChild(b);
    });
    panel.appendChild(pad);
  } else if (q.type === 'choice') {
    stage.innerHTML = q.fig || `<div style="font-size:80px;text-align:center">🤔</div>`;
    const box = mk('div', 'opts'); panel.appendChild(box); let sel = null;
    q.opts.forEach(t => { const b = mk('button', 'opt', t); b.onclick = () => { sel = t; box.querySelectorAll('.opt').forEach(x => x.classList.toggle('pick', x === b)); send.disabled = false; }; box.appendChild(b); });
    send.disabled = true; send.style.marginTop = '14px'; panel.appendChild(send);
    send.onclick = () => { if (!sel) return; lock(); onSubmit(sel, null, sel === q.a); };
  } else if (q.type === 'geo') {
    const ps = q.init.map(p => p.slice());
    stage.innerHTML = boardSVG(ps, { handles: true, fixed: q.fixed });
    const svg = stage.querySelector('svg'), band = svg.querySelector('#band');
    ps.forEach((p, i) => {
      if (q.fixed.includes(i)) return;
      const el = svg.querySelector('#v' + i); let s;
      dragify(svg, el, () => s = ps[i].slice(), dd => {
        if (send.disabled) return;
        const nx = clamp(Math.round(s[0] + dd[0]), 0, 6), ny = clamp(Math.round(s[1] + dd[1]), 0, 6);
        if (nx !== ps[i][0] || ny !== ps[i][1]) { ps[i] = [nx, ny]; band.setAttribute('points', pts(ps)); el.setAttribute('transform', `translate(${P(nx)},${P(ny)})`); beep([300 + ny * 40], .03); }
      }, () => onDraft({ ps }));
    });
    panel.insertAdjacentHTML('beforeend', '<div class="note" style="margin-bottom:10px">拖動紅色圓圈，把橡皮筋套到別的釘子上。圍好了再按「送出」。</div>');
    panel.appendChild(send);
    send.onclick = () => { lock(); const a = area2(ps) / 2, r = q.check(ps, a); onSubmit(`${a} 平方公分`, { ps }, r === true); };
  } else if (q.type === 'pull') {
    let t = q.startT;
    stage.innerHTML = pullSVG(q, t);
    const draw = () => { stage.innerHTML = pullSVG(q, t); hook(); ag.textContent = `角度：${pullInfo(q, t).ang}°`; };
    const ag = mk('div', 'read', ''); ag.style.fontSize = '24px';
    function hook() {
      const svg = stage.querySelector('svg'), ft = svg.querySelector('.foot');
      ft.classList.add('drag'); ft.setAttribute('r', 16);
      dragify(svg, ft, () => {}, () => {}, () => { onDraft({ t }); });
      ft.addEventListener('pointermove', e => {
        if (send.disabled || !ft.classList.contains('grab')) return;
        const I = pullInfo(q, 0), p = svgPt(svg, e), qq = [p.x / U - I.A[0], p.y / U - I.A[1]];
        t = clamp((qq[0] * I.d[0] + qq[1] * I.d[1]) / I.L2, q.range[0], q.range[1]);
        const F = pullInfo(q, t).F; ft.setAttribute('cx', P(F[0])); ft.setAttribute('cy', P(F[1]));
        const ln = svg.querySelector('.pull'); ln.setAttribute('x2', P(F[0])); ln.setAttribute('y2', P(F[1]));
        ag.textContent = `角度：${pullInfo(q, t).ang}°`;
      });
    }
    panel.insertAdjacentHTML('beforeend', '<div class="note" style="margin-bottom:10px">拖動紫色圓點，沿著底邊（和延長線）滑動，覺得畫好了再按「送出」。</div>');
    panel.appendChild(ag); panel.appendChild(send); draw();
    send.onclick = () => { lock(); const I = pullInfo(q, t); onSubmit(`${I.ang}°`, { t }, I.ok); };
  }
}

async function rosterPick(code, msg) {

async function doJoin(code, seat, nick) {

async function teacherOpen(code, key) {

  let rTick = null; const rerender = () => { clearTimeout(rTick); rTick = setTimeout(() => T.room && teacherRender(), 150); };

    .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms', filter: `code=eq.${code}` }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'players', filter: `room_code=eq.${code}` }, ev => {
      if (ev.eventType === 'DELETE' || !ev.new || ev.new.seat == null) return refresh();

      L.panel.innerHTML = `<span class="qtag">第 ${cur + 1} ${q.type === 'step' ? '步' : '題'}・${esc(tag)}</span><div class="prompt">${promptHTML}</div><div id="tstat"></div><div id="tbtns"></div><div class="row tg" id="ttog"></div><div id="dist"></div><div id="tconcept"></div>`;
      const tg = $('#ttog');
      [['showAns', '👁 顯示學生答案'], ['showOk', '✔ 顯示對錯'], ['showConcept', '📘 重點講解']].forEach(([k, lab]) => {
        const b = mk('button', 'tool' + (T[k] ? ' on' : ''), lab); b.onclick = () => { T[k] = !T[k]; b.classList.toggle('on', T[k]); teacherRender(); }; tg.appendChild(b);
      });
      const fx = mk('button', 'tool', '🖥️ 全螢幕講解'); fx.onclick = () => openExplain(); tg.appendChild(fx);
    }
    const stat = $('#tstat'), btns = $('#tbtns');
    const all = seats.length > 0 && waiting.length === 0;
    const W = q.type === 'step' ? ['完成', '做'] : ['答', '答'];
    stat.innerHTML = q.type === 'step' ? (all ? `<div class="fb good show">🎉 全班都完成這一步了！</div>` : `<div class="fb info show">還有 <b>${waiting.length}</b> 人沒完成：${waiting.map(s => s + ' 號').join('、')}</div>`) : rv ? `<div class="fb good show">正確答案：<b>${q.type === 'num' || q.type === 'choice' ? esc(q.a) + ' ' + (q.unit || '') : '見下方綠色的圖'}</b><br>${q.exp || ''}<br>全班答對 <b>${curAns.filter(a => a.correct).length}</b> / ${curAns.length} 人</div>`
      : all ? `<div class="fb good show">🎉 全班都答完了！</div>` : `<div class="fb info show">還有 <b>${waiting.length}</b> 人沒答：${waiting.map(s => s + ' 號').join('、')}</div>`;
    if (!all && !stat.querySelector('.rf')) { const rf = mk('button', 'linkbtn rf', '🔄 學生明明做完了？按這裡更新狀態'); rf.onclick = () => { teacherRefresh(); toast('已更新'); }; stat.appendChild(rf); }
    const bk = room.phase + all;
    if (btns.dataset.k !== bk) {
      btns.dataset.k = bk; btns.innerHTML = '';
      if (q.type === 'step') {
        const last = cur >= room.n_q - 1;
        const go = () => last ? setRoom(cur, 'end') : setRoom(cur + 1, 'question');
        const b = mk('button', 'big', last ? '🏁 結束，看全班紀錄' : `➡️ 下一步（第 ${cur + 2} 步）`); b.disabled = !all; b.onclick = go; btns.appendChild(b);
        if (!all) { const f = mk('button', 'linkbtn', '有人缺席或卡住？強制進下一步'); f.onclick = () => { if (confirm(`還有 ${waiting.length} 人沒完成，確定要繼續嗎？`)) go(); }; btns.appendChild(f); }
      } else if (!rv) {
        const b = mk('button', 'big', '📢 公布答案'); b.disabled = !all; b.onclick = () => setRoom(cur, 'reveal'); btns.appendChild(b);
        if (!all) { const f = mk('button', 'linkbtn', '有人缺席或卡住？強制公布'); f.onclick = () => { if (confirm(`還有 ${waiting.length} 人沒作答，確定要公布答案嗎？`)) setRoom(cur, 'reveal'); }; btns.appendChild(f); }
      } else {
        const last = cur >= room.n_q - 1;
        const b = mk('button', 'big', last ? '🏁 結束，看全班成績' : `➡️ 下一題（第 ${cur + 2} 題）`); b.onclick = () => last ? setRoom(cur, 'end') : setRoom(cur + 1, 'question'); btns.appendChild(b);
      }
    }
    if (cur > 0 && !btns.querySelector('.backq')) {
      const bb = mk('button', 'tool backq', q.type === 'step' ? '◀ 回上一步' : '◀ 回上一題（看答案講解）');
      bb.onclick = () => q.type === 'step' ? setRoom(cur - 1, 'question') : setRoom(cur - 1, 'reveal');
      btns.appendChild(bb);
    }
    $('#dist').innerHTML = (q.type === 'num' || q.type === 'choice') && (T.showAns || rv) ? distHTML(q, curAns, rv || T.showOk)
      : q.type === 'step' && T.showAns && curAns.some(a => a.graded) ? distHTML({ type: 'num', a: null }, curAns.filter(a => a.graded), false) : '';
    const ck = conceptOf(q, room.set_id), ex = q.exp || (q.fn && q.fn.meta && q.fn.meta.exp) || '';
    $('#tconcept').innerHTML = rv || T.showConcept ? conceptCard(ck, rv || q.type === 'step' ? ex : '') : '';
    L.below.innerHTML = tilesHTML(q, cur);
  } else if (room.phase === 'end') {
    if (T.shown !== viewKey) { T.shown = viewKey; }
    L.stage.innerHTML = `<div class="waitbox"><div class="big-ic">🏁</div><b>作答結束</b><p>${esc(setName(room.set_id))}</p></div>`;
    L.panel.innerHTML = `<span class="qtag">全班成績</span><p class="note">下表 ✓ 是答對、✗ 是答錯、空白是沒作答。</p>`;
    const dl = mk('button', 'big alt', '⬇️ 下載成績（CSV）'); dl.onclick = downloadCSV; L.panel.appendChild(dl);
    const nb = mk('button', 'big', '開新房間'); nb.onclick = () => { localStorage.removeItem('area-live-teacher'); teacherHome(); }; L.panel.appendChild(nb);
    L.below.innerHTML = summaryHTML();
  }
  L.below.querySelectorAll('[data-lb]').forEach(el => el.onclick = () => openLB(+el.dataset.lb));
  L.below.querySelectorAll('[data-kick]').forEach(b => b.onclick = async e => {
    e.stopPropagation(); const s = +b.dataset.kick;
    if (confirm(`把 ${s} 號移出房間？（例如學生坐錯座號）`)) { await sb.rpc('kick_seat', { p_code: T.code, p_key: T.key, p_seat: s }); teacherRefresh(); }
  });
}
/* 全螢幕講解：題目圖＋重要公式＋本題解法＋常見錯誤＋全班答對率 */
function openExplain() {
  const room = T.room, cur = room.q_index, q = T.qs[cur]; if (!q) return;
  const ck = conceptOf(q, room.set_id), ex = q.exp || (q.fn && q.fn.meta && q.fn.meta.exp) || '';
  const cs = T.answers.filter(a => a.q_index === cur), g = q.type === 'step' ? cs.filter(a => a.graded) : cs;
  const sv = $('#lstage svg'); const figHTML = sv ? sv.outerHTML : (q.fig || '');
  let box = $('#lightbox'); if (!box) { box = mk('div', 'lightbox'); box.id = 'lightbox'; document.body.appendChild(box); }
  box.innerHTML = `<div class="lbin xin"><div class="lbhead"><b>📘 重點講解</b><span>第 ${cur + 1} ${q.type === 'step' ? '步' : '題'}${g.length ? `　全班答對 ${g.filter(a => a.correct).length} / ${g.length} 人` : ''}</span><button class="tool" id="xAns">${T.xAns ? '🙈 隱藏解法' : '👁 顯示解法'}</button><button class="tool" id="lbX">✕ 關閉</button></div>
    <div class="xbody"><div class="xfig">${figHTML}</div><div class="xtext">${conceptCard(ck, T.xAns ? ex : '', true)}</div></div></div>`;
  $('#lbX').onclick = () => box.remove();
  $('#xAns').onclick = () => { T.xAns = !T.xAns; openExplain(); };
  box.onclick = e => { if (e.target === box) box.remove(); };
}
/* 放大檢視學生作品（講解用）：可左右切換、可隱藏座號 */
const LB = { hide: false };
function lbList() {
  const cur = T.room.q_index, q = T.qs[cur];
  return T.players.map(p => {
    const a = T.answers.find(x => x.seat === p.seat && x.q_index === cur);
    const im = a ? thumbOf(q, a.payload, T.showOk || T.room.phase === 'reveal') : (p.draft_q === cur && p.draft ? thumbOf(q, p.draft) : '');
    return im ? { seat: p.seat, im, a } : null;
  }).filter(Boolean);
}
function openLB(seat) {
  const list = lbList(); let i = Math.max(0, list.findIndex(x => x.seat === seat));
  let box = $('#lightbox'); if (!box) { box = mk('div', 'lightbox'); box.id = 'lightbox'; document.body.appendChild(box); }
  const draw = () => {
    const it = list[i]; if (!it) return box.remove();
    const who = LB.hide ? `作品 ${i + 1}` : `${it.seat} 號 ${esc((T.players.find(p => p.seat === it.seat) || {}).nick || '')}`;
    box.innerHTML = `<div class="lbin"><div class="lbhead"><b>${who}</b><span>${it.a ? (T.showAns ? '答案：' + esc(it.a.answer) : '已完成') : '✏️ 操作中'}　${i + 1} / ${list.length}</span>
      <button class="tool" id="lbHide">${LB.hide ? '👁 顯示座號' : '🙈 隱藏座號'}</button><button class="tool" id="lbX">✕ 關閉</button></div>
      <div class="lbimg">${it.im}</div>
      <div class="lbnav"><button class="big alt" id="lbP">◀ 上一位</button><button class="big alt" id="lbN">下一位 ▶</button></div></div>`;
    $('#lbX').onclick = () => box.remove();
    $('#lbHide').onclick = () => { LB.hide = !LB.hide; draw(); };
    $('#lbP').onclick = () => { i = (i - 1 + list.length) % list.length; draw(); };
    $('#lbN').onclick = () => { i = (i + 1) % list.length; draw(); };
  };
  box.onclick = e => { if (e.target === box) box.remove(); };
  draw();
}
function teacherEndBtn(panel) { const b = mk('button', 'linkbtn', '關閉這個房間'); b.onclick = () => { if (confirm('確定要關閉房間嗎？')) setRoom(T.room.q_index, 'end'); }; panel.appendChild(b); }
function tilesHTML(q, cur) {
  const head = `<h3 class="tiles-h">${cur < 0 ? '🙋 已加入的勇者' : '📋 全班狀況'}　<span>${T.players.length} 人</span></h3>`;
  if (!T.players.length) return head + `<div class="tiles-empty">還沒有學生加入，請學生掃 QR code 或輸入房間碼 ${T.room ? T.room.code : ''}</div>`;
  const big = q && (q.type === 'geo' || q.type === 'pull' || q.type === 'step'), rv = T.room.phase === 'reveal', roster = T.room.titles || {};
  return head + `<div class="hgrid ${big ? 'big' : ''}">` + T.players.map(p => {
    const a = cur >= 0 ? T.answers.find(x => x.seat === p.seat && x.q_index === cur) : null;
    const working = !a && big && p.draft_q === cur && p.draft;
    const showOk = a && (T.showOk || rv);
    let st, cls;
    if (cur < 0) { st = '🙋 已加入'; cls = 'in'; }
    else if (a) {
      if (q.type === 'step' && !a.graded) { st = '✅ 完成'; cls = 'done'; }
      else if (showOk) { st = a.correct ? '✅ 答對' : '❌ 答錯'; cls = a.correct ? 'done' : 'bad'; }
      else { st = '📮 已送出'; cls = 'sent'; }
    } else if (working) { st = '✏️ 操作中'; cls = 'work'; } else { st = '⏳ 等待中'; cls = 'wait'; }
    let thumb = '';
    if (big) { const im = a ? thumbOf(q, a.payload, showOk) : working ? thumbOf(q, p.draft) : ''; thumb = `<div class="thumb ${im ? 'zoom' : ''}" ${im ? `data-lb="${p.seat}"` : ''}>${im || '<span class="nothumb">還沒開始</span>'}</div>`; }
    const ans = a && (T.showAns || rv) ? `<div class="ta">${esc(a.answer)}</div>` : '';
    return `<div class="hcard ${cls}"><span class="hseat">${p.seat}</span>${big ? '' : petImg(roster[p.seat])}${thumb}${pName(p.seat)}<div class="hrib">${big ? petImg(roster[p.seat], 'mini') : ''}${esc(p.nick || rT(roster[p.seat]))}</div>${T.names[p.seat] ? `<small class="hname">${esc(T.names[p.seat])}</small>` : ''}${ans}<div class="hst">${st}</div><button class="kick" data-kick="${p.seat}" title="移出">×</button></div>`;
  }).join('') + '</div>';
}
function distHTML(q, curAns, mark) {
  const cnt = {}; curAns.forEach(a => cnt[a.answer] = (cnt[a.answer] || 0) + 1);
  const keys = q.type === 'choice' ? q.opts.slice() : Object.keys(cnt).sort((x, y) => cnt[y] - cnt[x]);
  const max = Math.max(1, ...Object.values(cnt));
  return `<div class="dist"><div class="note">答案分布</div>` + keys.map(k => {
    const n = cnt[k] || 0, ok = mark && String(k) === String(q.a);
    return `<div class="dr ${ok ? 'ok' : ''}"><span class="dk">${esc(k)}${ok ? ' ✅' : ''}</span><span class="db"><i style="width:${n / max * 100}%"></i></span><span class="dn">${n}</span></div>`;
  }).join('') + '</div>';
}
function summaryHTML() {
  const n = T.room.n_q;
  let h = `<div class="sumwrap"><table class="tb sum"><tr><th>座號</th>${Array.from({ length: n }, (_, i) => `<th>${i + 1}</th>`).join('')}<th>答對</th></tr>`;
  T.players.forEach(p => {
    let ok = 0;
    h += `<tr><td>${seatLabel(p.seat)}</td>` + Array.from({ length: n }, (_, i) => { const a = T.answers.find(x => x.seat === p.seat && x.q_index === i); if (a && a.correct) ok++; return a && isSt(T.room.set_id) && !a.graded ? '<td class="c2">●</td>' : `<td class="${a ? (a.correct ? 'c1' : 'c0') : ''}">${a ? (a.correct ? '✓' : '✗') : ''}</td>`; }).join('') + `<td class="n">${ok}</td></tr>`;
  });
  h += `<tr><th>答對率</th>` + Array.from({ length: n }, (_, i) => { const xs = T.answers.filter(a => a.q_index === i); return `<th>${xs.length ? Math.round(xs.filter(a => a.correct).length / xs.length * 100) + '%' : '—'}</th>`; }).join('') + '<th></th></tr></table></div>';
  return h;
}
function downloadCSV() {
  const n = T.room.n_q, rows = [['座號', '稱號', '姓名', ...Array.from({ length: n }, (_, i) => `第${i + 1}題`), '答對題數']];
  T.players.forEach(p => {
    let ok = 0;
    const cells = Array.from({ length: n }, (_, i) => { const a = T.answers.find(x => x.seat === p.seat && x.q_index === i); if (a && a.correct) ok++; return a ? `${a.correct ? '✓' : '✗'} ${a.answer}` : ''; });
    rows.push([p.seat, p.nick || '', T.names[p.seat] || PERSONA[p.seat] || '', ...cells, ok]);
  });
  const csv = '﻿' + rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `面積即時作答_${T.room.code}_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
}

/* 切回這個分頁、視窗取得焦點或網路恢復時，立刻同步一次（背景分頁的計時器會被瀏覽器放慢） */
const liveKick = () => { if (document.hidden) return; if (liveMode === 'teacher' && T.code) teacherRefresh(); else if (liveMode === 'student' && S.code) studentRefresh(); };
document.addEventListener('visibilitychange', liveKick); window.addEventListener('focus', liveKick); window.addEventListener('online', liveKick);
/* ---------- 網址路由 ---------- */
function route() {
  const h = location.hash;
  if (h.startsWith('#teacher')) return teacherHome();
  if (h.startsWith('#live')) {
    const code = (h.split('=')[1] || '').replace(/\D/g, '');
    const saved = JSON.parse(localStorage.getItem('area-live-student') || 'null');
    if (code && saved && saved.code === code) return doJoin(code, saved.seat);
    return studentJoin(code);
  }
}

/* 首頁插圖：平行四邊形 → 長方形 */
$('#heroArt').innerHTML = fig(14, 6,
  poly([[1, 5], [5, 5], [6, 1], [2, 1]], 'shape s-or') + seg([2, 1], [2, 5], 'hgt') + `<text x="${P(2)}" y="${P(.45)}" font-size="30" text-anchor="middle">✂️</text>` +
  `<text x="${P(7.5)}" y="${P(3.2)}" font-size="40" text-anchor="middle">➜</text>` +
  poly([[9, 5], [13, 5], [13, 1], [9, 1]], 'shape s-or') + poly([[12, 5], [13, 5], [13, 1]], 'shape s-teal'));
renderHome();
window.addEventListener('hashchange', () => { if (/^#(live|teacher)/.test(location.hash)) route(); else goHome(); });
route();
</script>
